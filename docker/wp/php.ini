memory_limit = -1
upload_max_filesize = 1G
post_max_size = 1G

# Forward mail to the MailHog container. Use SMTPSERVER and EMAIL
# environment variables to specify --host and --from values.
sendmail_path = "/usr/bin/msmtp --port=1025 --read-recipients"

[xdebug]
# For Xdebug 2
xdebug.remote_autostart=1
xdebug.remote_connect_back = 1
xdebug.remote_enable = 1
xdebug.remote_host = ${XDEBUG_CLIENT_HOST}
xdebug.remote_port = ${XDEBUG_CLIENT_PORT}

# For Xdebug 3
xdebug.client_host = ${XDEBUG_CLIENT_HOST}
xdebug.client_port = ${XDEBUG_CLIENT_PORT}
xdebug.discover_client_host = 1
xdebug.mode = debug
xdebug.scream = 1
xdebug.start_with_request = yes

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 1
